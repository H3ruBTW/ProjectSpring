<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opere</title>
    <link href="assets/css/opere_admin.css" rel="stylesheet">
    <script src="assets/js/opere_admin.js" defer></script>
</head>
<body>
    <main class="main">
        <div class="main-opere">
            <form id="form-filtri">
                <div class="filter">
                    <div class="add-search">
                        <div>
                            <label>Barra di ricerca</label>
                            <input type="text">
                        </div>
                        <div>
                            <button id="search" type="submit">Applica filtri</button>
                            <button id="add" type="button">Aggiungi un opera</button>
                        </div>
                        
                    </div>
                    <div class="other-filters">
                        <div>
                            <label>Autore</label>
                            <input type="text">
                        </div>
                        <div>
                            <label>Anno Creazione da</label>
                            <input type="number">
                        </div>
                        <div>
                            <label>Anno Creazione a</label>
                            <input type="number">
                        </div>
                        
                    </div>
                </div>
            </form>
            
            <div class="opere-wrapper">
                
            </div>
            
        </div>
    </main>
</body>
</html>
